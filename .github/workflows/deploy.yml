name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Gated environment
        type: choice
        options:
          - staging
          - production
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/deploy-env
        with:
          stage: PhotoprintDev
          image-tag: ${{ github.event.workflow_run.head_sha }}

  deploy-gated:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-env
        with:
          stage: ${{ inputs.environment == 'production' && 'PhotoprintProduction' || 'PhotoprintStaging' }}
          image-tag: ${{ github.sha }}
