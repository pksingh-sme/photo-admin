name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  typecheck:
    name: tsc (including specs)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  tenant-request:
    name: FR-API-003
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:tenant-request

  tenancy:
    name: test/tenancy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Required. Fails if a tenantOwned() table has no assertTenantIsolation
      # suite (FR-TEN-010). Green with zero entities; adding a table without a
      # suite turns the job red.
      - run: npm run test:tenancy

  gitleaks:
    name: gitleaks (FR-SEC-001)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          arch="linux_arm64"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${arch}.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan pull request diff
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --exit-code 1 \
            --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Scan full git history
        if: github.event_name != 'pull_request'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --exit-code 1

  image:
    name: docker linux/arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build Graviton image
        run: docker build --platform linux/arm64 -t photoprint-api:${{ github.sha }} .
      - name: Runtime has no scripts/
        run: |
          docker run --rm --user root --entrypoint /bin/sh photoprint-api:${{ github.sha }} \
            -c 'test ! -e /app/scripts && test -f /app/dist/main.js'
      - name: Container answers GET /health
        run: |
          docker run -d --name photoprint-api-smoke \
            -e NODE_ENV=development \
            -e MYSQL_PASSWORD=ci-smoke \
            -e OTEL_SDK_DISABLED=true \
            -p 3000:3000 \
            photoprint-api:${{ github.sha }}
          trap 'docker logs photoprint-api-smoke; docker rm -f photoprint-api-smoke' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          echo "health check did not become ready"
          exit 1

  infra:
    name: cdk synth
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.json
      - name: Synth (EEA)
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: eu-central-1
        run: npx cdk synth --quiet --region eu-central-1 --context imageTag=${{ github.sha }}
