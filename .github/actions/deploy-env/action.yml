name: deploy-env
description: Build the linux/arm64 image, push to ECR, and CDK-deploy one environment
inputs:
  stage:
    description: CDK stage id (PhotoprintDev, PhotoprintStaging, PhotoprintProduction)
    required: true
  image-tag:
    description: Image tag, usually the git SHA
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: infra/package-lock.json
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        aws-region: eu-central-1
    - name: Install CDK app
      shell: bash
      working-directory: infra
      run: npm ci
    - name: Account and region
      id: aws
      shell: bash
      run: |
        account="$(aws sts get-caller-identity --query Account --output text)"
        echo "account=${account}" >> "$GITHUB_OUTPUT"
        echo "CDK_DEFAULT_ACCOUNT=${account}" >> "$GITHUB_ENV"
        echo "CDK_DEFAULT_REGION=eu-central-1" >> "$GITHUB_ENV"
    - name: Deploy toolchain (ECR)
      shell: bash
      working-directory: infra
      run: npx cdk deploy PhotoprintToolchain --require-approval never --region eu-central-1
    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build and push linux/arm64
      shell: bash
      env:
        ACCOUNT: ${{ steps.aws.outputs.account }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        image="${ACCOUNT}.dkr.ecr.eu-central-1.amazonaws.com/photoprint-api:${IMAGE_TAG}"
        docker build --platform linux/arm64 -t "${image}" .
        docker push "${image}"
    - name: Deploy platform stage
      shell: bash
      working-directory: infra
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
        STAGE: ${{ inputs.stage }}
      run: |
        npx cdk deploy "${STAGE}/Platform" \
          --require-approval never \
          --region eu-central-1 \
          --context "imageTag=${IMAGE_TAG}"
